version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: claimassure-db
    environment:
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: claims_secure_pass_2026
      POSTGRES_DB: claimassure
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claimassure"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: claimassure-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimassure-backend
    environment:
      DATABASE_URL: postgresql://claims_user:claims_secure_pass_2026@postgres:5432/claimassure
      REDIS_URL: redis://redis:6379/0
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://your-resource.openai.azure.com/}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-azure_ai/genailab-maas-DeepSeek-V3-0324}
      AZURE_DOC_INTELLIGENCE_ENDPOINT: ${AZURE_DOC_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOC_INTELLIGENCE_KEY: ${AZURE_DOC_INTELLIGENCE_KEY:-}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claimassure-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
